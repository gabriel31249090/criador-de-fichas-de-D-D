name: DND Compendium UI checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Prepare Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Test characters, equipment, spells and Dungeon Master
        run: |
          python -m http.server 8091 --bind 127.0.0.1 >/tmp/dnd-server.log 2>&1 &
          sleep 2
          node tests/compendium.spec.cjs